[package]
name = "nether-setup"
version = "0.1.0"
edition = "2021"
description = "Nether Client installer, uninstaller and update applier (embeds the release launcher exe)"

[features]
# dev-only screenshot hook: NC_SETUP_SNAP=<png>|<mode 0/1/2>|<step>|<installed version>
dev = ["dep:image"]

[[bin]]
name = "NetherClientSetup"
path = "src/main.rs"

[dependencies]
slint = { version = "1", features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"
flate2 = "1"
rfd = "0.18.0"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[build-dependencies]
slint-build = "1"
winresource = "0.1"
flate2 = "1"
