[package]
name = "nether-social"
version = "0.1.0"
edition = "2021"
description = "Parties and peer-to-peer links (iroh QUIC), cosmetic models and their previews, and skins"

[features]
# developer switches used by party_net (see nether-core's `dev` feature); never in shipped builds
dev = []

[dependencies]
nether-common = { path = "../common" }
nether-net = { path = "../net" }
anyhow = "1"
base64 = "0.22"
bytes = "1"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
iroh = "1.4"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
url = "2"
