[package]
name = "nether-net"
version = "0.1.0"
edition = "2021"
description = "HTTP downloads with hash checks, hosting network helpers (UPnP, public IP) and the signed launcher auto-update"

[dependencies]
nether-common = { path = "../common" }
anyhow = "1"
hex = "0.4"
igd-next = "0.18.0"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
