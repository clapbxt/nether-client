[package]
name = "nether-core"
version = "0.1.0"
edition = "2021"

[features]
# developer switches (offline launch via NETHER_DEV_OFFLINE, NETHER_AGENT jar override); never in shipped builds
dev = ["nether-auth/dev"]

[dependencies]
nether-common = { path = "../common" }
nether-net = { path = "../net" }
nether-auth = { path = "../auth" }
anyhow = "1"
dirs = "5"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
hex = "0.4"
md5 = "0.7"
rayon = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
base64 = "0.22"
url = "2"
ring = "0.17"
# Invite to world: peer-to-peer QUIC with hole punching, relay fallback (no accounts, no port forwarding)
iroh = "1.4"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
bytes = "1"
rusqlite = { version = "0.43.0", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
# AVIF textures in cosmetic uploads (Lunar uses some): Windows' own decoder (AV1 Video Extension)
windows = { version = "0.62", features = ["Foundation", "Graphics_Imaging", "Storage_Streams"] }

