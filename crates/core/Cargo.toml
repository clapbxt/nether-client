[package]
name = "nether-core"
version = "0.1.0"
edition = "2021"

[features]
# developer switches (offline launch via NETHER_DEV_OFFLINE, NETHER_AGENT jar override); never in shipped builds
dev = []

[dependencies]
anyhow = "1"
dirs = "5"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
hex = "0.4"
keyring = { version = "3", features = ["windows-native"] }
md5 = "0.7"
rayon = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
igd-next = "0.18.0"
base64 = "0.22"
url = "2"
ring = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_Foundation"] }

