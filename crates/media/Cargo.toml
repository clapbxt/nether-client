[package]
name = "nether-media"
version = "0.1.0"
edition = "2021"
description = "Now-playing helper for the Nether Client agent: Windows media controls (GSMTC) as line JSON over stdio"

[[bin]]
name = "nether-media"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_Threading",
] }
