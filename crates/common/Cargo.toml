[package]
name = "nether-common"
version = "0.1.0"
edition = "2021"
description = "Shared vocabulary of the launcher crates: data folder paths, safe JSON files, the Recycle Bin, Progress and Session"

[dependencies]
anyhow = "1"
dirs = "5"
hex = "0.4"
md5 = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Security"] }
