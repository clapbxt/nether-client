[package]
name = "nether-app"
version = "0.1.5"
edition = "2021"

[features]
# developer switches, see nether-core's `dev` feature (`cargo run -p nether-app --features dev`)
dev = ["nether-core/dev"]

[dependencies]
anyhow = "1"
nether-core = { path = "../core" }
slint = { version = "1", features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_System_Ole", "Win32_System_Com", "Win32_System_Time"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webbrowser = "1"
arboard = "3"
rfd = "0.18.0"
tray-icon = "0.26.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
slint-build = "1"
winresource = "0.1"


[dev-dependencies]
resvg = "0.48"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
