[package]
name = "nether-auth"
version = "0.1.0"
edition = "2021"
description = "Microsoft account sign-in (device code, Xbox Live, XSTS, Minecraft services) and the launch ownership gate"

[features]
# NETHER_DEV_OFFLINE offline launches (see nether-core's `dev` feature); never in shipped builds
dev = []

[dependencies]
nether-common = { path = "../common" }
anyhow = "1"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
