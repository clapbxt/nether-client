  --ln: rgba(255,255,255,.08); --ln2: rgba(255,255,255,.16);
  --ac: #E5372D; --ice: #EEF1F5;
}
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 Barlow, system-ui, sans-serif; padding: 48px 32px 80px; }
.px { font-family: "Nether Pixel", monospace; font-weight: normal; }
header { max-width: 1320px; margin: 0 auto 32px; display: grid; grid-template-columns: 1fr auto; gap: 32px; align-items: end; }
h1 { font-size: 48px; line-height: 1; letter-spacing: 0; }
header p { color: var(--dim); max-width: 620px; margin-top: 14px; }
.build { display: flex; gap: 16px; align-items: center; }
.build figure { background: var(--s1); border: 1px solid var(--ln); border-radius: 8px; padding: 12px; text-align: center; }
.build figcaption { color: var(--mut); font-size: 12px; margin-top: 6px; }
.grid { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 16px; }
.card { background: var(--s1); border: 1px solid var(--ln); border-radius: 8px; overflow: hidden; }
.hero { height: 240px; display: grid; place-items: center; border-bottom: 1px solid var(--ln); position: relative; }
.hero .tag { position: absolute; left: 16px; top: 14px; font-size: 16px; color: var(--mut); }
.meta { padding: 16px 18px 4px; }
.meta h2 { font-size: 24px; line-height: 1.1; }
.meta p { color: var(--dim); font-size: 13px; margin-top: 4px; min-height: 40px; }
.row { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 12px; padding: 12px 18px; border-top: 1px solid var(--ln); }
.row > span { color: var(--mut); font-size: 12px; }
.items { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.chip { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 6px; }
.chip.dark { background: var(--s3); }
.chip.light { background: var(--ice); color: #171A21; }
.chip b { font-size: 16px; }
.mc { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.world { height: 58px; border-radius: 6px; display: grid; place-items: center; background: linear-gradient(#7FA4CB, #B6CDE2 70%, #5F8F3A 70%, #4E7A2F); image-rendering: pixelated; }
.world.nether { background: linear-gradient(#3A0E0C, #5A1612 70%, #6E2420 70%, #4B1714); }
.nametag { background: rgba(0,0,0,.25); padding: 1px 3px 0; display: flex; align-items: center; gap: 4px; font-size: 16px; line-height: 18px; color: #fff; }
.chat { background: rgba(0,0,0,.5); padding: 3px 6px; display: flex; align-items: center; gap: 4px; font-size: 16px; line-height: 18px; color: #fff; border-radius: 2px; }
.chat .g, .nametag .g { display: block; }
.pick { color: var(--ac); }
@media (max-width: 720px) { body { padding: 32px 16px; } header { grid-template-columns: 1fr; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div>
    <h1 class="px">NETHER MARK</h1>
    <p>One ghast, built on a 9&times;9 grid so the in-game glyph and the vector logo are the same shape. Twelve finishes of that one mark. Each card shows the hero, the app icon at 64/32/16, UI sizes on dark and Ice, and the 9&times;9 glyph in a nametag and chat line at GUI scale 2.</p>
  </div>
  <div class="build" id="build"></div>
</header>
<main class="grid" id="grid"></main>

<script>
const C = { W: "#FFFFFF", G: "#C4C9D1", R: "#E5372D", K: "#0B0B0D", D: "#171A21" };
const u = 8.6, HU = 6.4, L = [2.2, 3.2, 1.4, 3.6, 2.4];
const ox = (100 - 9 * u) / 2, oy = (100 - (HU + Math.max(...L)) * u) / 2, hb = oy + HU * u;
let uid = 0;

// Silhouette: rounded head + five tentacles with round ends, one closed path.
function silhouette() {
  const r = 1.1 * u, h = u / 2, R = ox + 9 * u;
  let d = `M${ox} ${oy + r}Q${ox} ${oy} ${ox + r} ${oy}H${R - r}Q${R} ${oy} ${R} ${oy + r}`;
  const cols = [8, 6, 4, 2, 0], lens = [L[4], L[3], L[2], L[1], L[0]];
  cols.forEach((c, i) => {
    const x0 = ox + c * u, x1 = x0 + u, y = hb + lens[i] * u - h;
    d += `${i ? `H${x1}` : ""}V${y}A${h} ${h} 0 0 1 ${x0} ${y}`;
    if (i < 4) d += `V${hb}`;
  });
  return d + "Z";
}
const SIL = silhouette();
const eye = (x, rot) => `<rect x="${x}" y="${oy + 2.1 * u}" width="${2.1 * u}" height="${0.85 * u}" rx="${0.3 * u}" transform="rotate(${rot} ${x + 1.05 * u} ${oy + 2.52 * u})"/>`;
const EYES = eye(ox + 0.95 * u, 7) + eye(ox + 5.95 * u, -7);
const MOUTH = `<rect x="${ox + 4 * u}" y="${oy + 3.3 * u}" width="${u}" height="${2.1 * u}" rx="${0.45 * u}"/>`;
const TEAR = (() => { const x = ox + 2.35 * u, y = oy + 3.55 * u, w = 0.36 * u; return `<path d="M${x} ${y}C${x + w * 0.4} ${y + w} ${x + w * 1.2} ${y + w * 1.6} ${x + w * 1.2} ${y + w * 2.2}A${w * 1.2} ${w * 1.2} 0 0 1 ${x - w * 1.2} ${y + w * 2.2}C${x - w * 1.2} ${y + w * 1.6} ${x - w * 0.4} ${y + w} ${x} ${y}Z"/>`; })();

// Solid mark in a 100 box. o: fill, s (scale), mouth/tear/stripe colours, dx/dy.
function mark(o = {}) {
  const id = "m" + uid++, s = o.s || 1, t = `translate(${50 + (o.dx || 0)} ${50 + (o.dy || 0)}) scale(${s}) translate(-50 -50)`;
  let extra = "";
  if (o.stripe) extra += `<rect x="${ox + 2 * u}" y="0" width="${u}" height="100" fill="${o.stripe}"/><rect x="${ox + 3.3 * u}" y="0" width="${0.32 * u}" height="${hb + 0.2}" fill="${o.stripe}"/>`;
  const face = o.mouth ? EYES : EYES + MOUTH;
  return `<g transform="${t}"><mask id="${id}"><path d="${SIL}" fill="#fff"/><g fill="#000">${face}</g></mask>
    <g mask="url(#${id})"><rect width="100" height="100" fill="${o.fill || C.W}"/>${extra}${o.tear ? `<g fill="${o.tear}">${TEAR}</g>` : ""}</g>
    ${o.mouth ? `<g fill="${o.mouth}">${MOUTH}</g>` : ""}</g>`;
}
function lineMark(o = {}) {
  const s = o.s || 1, sw = o.sw || 6, c = o.fill || C.W, t = `translate(50 50) scale(${s}) translate(-50 -50)`;
  const top = oy + sw / 2, x0 = ox + sw / 2, w = 9 * u - sw, hh = HU * u - sw;
  const tents = [0, 2, 4, 6, 8].map((k, i) => { const x = ox + (k + 0.5) * u; return `<line x1="${x}" y1="${hb + sw * 1.4}" x2="${x}" y2="${hb + L[i] * u - sw / 2}"/>`; }).join("");
  const eyeL = (x, rot) => `<line x1="${x}" y1="${oy + 2.5 * u}" x2="${x + 1.7 * u}" y2="${oy + 2.5 * u}" transform="rotate(${rot} ${x + 0.85 * u} ${oy + 2.5 * u})"/>`;
  return `<g transform="${t}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">
    <rect x="${x0}" y="${top}" width="${w}" height="${hh}" rx="${1.1 * u}"/>${tents}${eyeL(ox + 1.3 * u, 7)}${eyeL(ox + 6 * u, -7)}
    <line x1="${ox + 4.5 * u}" y1="${oy + 3.75 * u}" x2="${ox + 4.5 * u}" y2="${oy + 4.9 * u}" stroke="${o.mouth || c}"/></g>`;
}

// Pixel glyphs. W white, G ice grey, R accent, K obsidian, . clear.
const GLYPH = {
  core: [".WWWWWWW.", "WWWWWWWWW", "W..WWW..W", "WWWW.WWWW", "WWWW.WWWW", "WWWWWWWWW", "W.W.W.W.W", "W.W...W.W", "..W...W.."],
  ember: [".WWWWWWW.", "WWWWWWWWW", "W..WWW..W", "WWWWRWWWW", "WWWWRWWWW", "WWWWWWWWW", "W.W.W.W.W", "W.W...W.W", "..W...W.."],
  tear: [".WWWWWWW.", "WWWWWWWWW", "W..WWW..W", "WWRW.WWWW", "WWWW.WWWW", "WWWWWWWWW", "W.W.W.W.W", "W.W...W.W", "..W...W.."],
  livery: [".WRWWWWW.", "WWRWWWWWW", "W..WWW..W", "WWRW.WWWW", "WWRW.WWWW", "WWRWWWWWW", "W.R.W.W.W", "W.R...W.W", "..R...W.."],
  shaded: [".WWWWWWW.", "WWWWWWWWW", "W..WWW..W", "WWWW.WWWW", "WGWW.WWGW", "GGGGGGGGG", "W.G.W.G.W", "W.G...G.W", "..G...G.."],
  redtile: [".RRRRRRR.", "RWWWWWWWR", "RWRWWWRWR", "RWWWRWWWR", "RWWWRWWWR", "RWWWWWWWR", "RWRWRWRWR", "RWRRRWRWR", ".RRRRRRR."],
  obsidian: [".KKKKKKK.", "KWWWWWWWK", "KWKWWWKWK", "KWWWRWWWK", "KWWWRWWWK", "KWWWWWWWK", "KWKWKWKWK", "KWKKKWKWK", ".KKKKKKK."],
  chamfer: ["KKKKKKK..", "KWWWWWWK.", "KWKWWWKWK", "KWWWRWWWK", "KWWWRWWWK", "KWWWWWWWK", "KWKWKWKWK", ".WKKKWKWK", "..KKKKKKK"],
};
const HI = [
  ".WWWWWWWWWWWWWWW..", "WWWWWWWWWWWWWWWWW.", "WWWWWWWWWWWWWWWWWW", "WWWWWWWWWWWWWWWWWW",
  "WW....WWWWWW....WW", "WWWW...WWWW...WWWW", "WWWWWWWWWWWWWWWWWW", "WWWWWWWW..WWWWGGWW",
  "WWGGWWWW..WWWWGWWW", "WWWGWWWW..WWWWWWWW", "GGGGGGGG..GGGGGGGG", "GGGGGGGGGGGGGGGGGG",
  "WW..GG..WW..GG..WW", "WW..GG..WW..GG..WW", "WW..GG..WW..GG..WW", "WW..GG......GG..WW",
  "....GG......GG....", "............GG....",
];
function pixels(g, s = 0.81, map = {}) {
  const n = g.length, cell = 100 * s / n, o = (100 - 100 * s) / 2;
  let r = "";
  g.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== ".") r += `<rect x="${(o + x * cell).toFixed(3)}" y="${(o + y * cell).toFixed(3)}" width="${cell + 0.05}" height="${cell + 0.05}" fill="${map[ch] || C[ch]}"/>`; }));
  return `<g shape-rendering="crispEdges">${r}</g>`;
}
const svg = (inner, size, extra = "") => `<svg width="${size}" height="${size}" viewBox="0 0 100 100" ${extra}>${inner}</svg>`;
const glyph = (g, k = 2) => { const n = g.length; let r = ""; g.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== ".") r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${C[ch]}"/>`; })); return `<svg class="g" width="${n * k}" height="${n * k}" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges">${r}</svg>`; };

// Tiles
const squircle = (fill, line = "rgba(255,255,255,.10)") => `<rect x="1" y="1" width="98" height="98" rx="23" fill="${fill}" stroke="${line}" stroke-width="1"/>`;
const CHAMF = "6,6 76,6 94,24 94,94 24,94 6,76";
const chamfer = () => `<polygon points="${CHAMF}" fill="${C.K}" stroke="rgba(255,255,255,.16)" stroke-width="1"/><line x1="6" y1="76" x2="24" y2="94" stroke="${C.R}" stroke-width="3" stroke-linecap="butt"/>`;
const ring = (c) => `<circle cx="50" cy="50" r="45" fill="none" stroke="${c}" stroke-width="3.2"/>`;

const STYLES = [
  { key: "A", name: "Core", note: "The master. Flat white ghast, face cut out, no accent. Works on anything dark.",
    hero: () => mark({ s: 0.95 }), app: () => squircle("#000") + mark({ s: 0.62 }), ui: (c) => mark({ fill: c }), g: "core" },
  { key: "B", name: "Ember", note: "Core plus a racing-red mouth: the one accent, exactly like PLAY in the UI.",
    hero: () => mark({ s: 0.95, mouth: C.R }), app: () => squircle("#000") + mark({ s: 0.62, mouth: C.R }), ui: (c) => mark({ fill: c, mouth: C.R }), g: "ember" },
  { key: "C", name: "Tear", note: "A single red ghast tear under the left eye. Quiet, memorable, nods to the item.",
    hero: () => mark({ s: 0.95, tear: C.R }), app: () => squircle("#000") + mark({ s: 0.62, tear: C.R }), ui: (c) => mark({ fill: c, tear: C.R }), g: "tear" },
  { key: "D", name: "Livery", note: "A red racing stripe down one tentacle and through the head. Motorsport, not monster.",
    hero: () => mark({ s: 0.95, stripe: C.R }), app: () => squircle("#000") + mark({ s: 0.62, stripe: C.R }), ui: (c) => mark({ fill: c, stripe: C.R }), g: "livery" },
  { key: "E", name: "Red tile", note: "Accent-filled tile, white ghast, face shows the red through. Loudest app icon.",
    hero: () => svg(squircle(C.R, "none") + mark({ s: 0.64 }), 170), heroRaw: true, app: () => squircle(C.R, "none") + mark({ s: 0.64 }),
    ui: (c, light) => squircle(C.R, "none") + mark({ s: 0.64 }), g: "redtile" },
  { key: "F", name: "Obsidian tile", note: "OLED tile with an ice hairline, white ghast, red mouth. Calm and premium.",
    hero: () => svg(squircle(C.K, "rgba(255,255,255,.14)") + mark({ s: 0.62, mouth: C.R }), 170), heroRaw: true, app: () => squircle(C.K, "rgba(255,255,255,.14)") + mark({ s: 0.62, mouth: C.R }),
    ui: () => squircle(C.K, "rgba(255,255,255,.14)") + mark({ s: 0.62, mouth: C.R }), g: "obsidian" },
  { key: "G", name: "Chamfer", note: "The current badge, rebuilt: clean cut corners, hairline, one red edge. No lava, no dust.",
    hero: () => svg(chamfer() + mark({ s: 0.6, mouth: C.R }), 170), heroRaw: true, app: () => chamfer() + mark({ s: 0.6, mouth: C.R }),
    ui: () => chamfer() + mark({ s: 0.6, mouth: C.R }), g: "chamfer" },
  { key: "H", name: "Pixel", note: "The 9×9 glyph is the logo. Identical at every size, from nametag to splash.",
    hero: () => pixels(GLYPH.core, 0.8), app: () => squircle("#000") + pixels(GLYPH.core, 0.56), ui: (c) => pixels(GLYPH.core, 0.86, { W: c }), g: "core" },
  { key: "I", name: "Pixel shaded", note: "18×18 two-tone ghast with the signature notch and cheek marks. Most Minecraft.",
    hero: () => pixels(HI, 0.8), app: () => squircle("#000") + pixels(HI, 0.6), ui: (c, light) => pixels(HI, 0.86, light ? { W: c, G: "#6B707B" } : {}), g: "shaded" },
  { key: "J", name: "Line", note: "Monoline, round caps, same stroke logic as the module icons. Pure UI mark.",
    hero: () => lineMark({ s: 0.95, sw: 5 }), app: () => squircle("#000") + lineMark({ s: 0.62, sw: 7 }), ui: (c) => lineMark({ fill: c, sw: 8 }), g: "core" },
  { key: "K", name: "Ring", note: "Ghast inside a thin ring: a seal for avatars, the cape tag and the title screen.",
    hero: () => ring(C.W) + mark({ s: 0.6 }), app: () => squircle("#000") + ring("rgba(255,255,255,.9)").replace('r="45"', 'r="38"') + mark({ s: 0.5 }),
    ui: (c) => ring(c) + mark({ s: 0.6, fill: c }), g: "core" },
  { key: "L", name: "Offset", note: "White ghast over a hard red offset shadow. Bold, sticker-like, reads at distance.",
    hero: () => mark({ s: 0.88, fill: C.R, dx: 3.5, dy: 3.5 }) + mark({ s: 0.88, dx: -1.5, dy: -1.5 }),
    app: () => squircle("#000") + mark({ s: 0.58, fill: C.R, dx: 2.6, dy: 2.6 }) + mark({ s: 0.58, dx: -1, dy: -1 }),
    ui: (c) => mark({ s: 0.9, fill: C.R, dx: 4, dy: 4 }) + mark({ s: 0.9, fill: c, dx: -2, dy: -2 }), g: "ember" },
];

const card = (st) => {
  const hero = st.heroRaw ? st.hero() : svg(st.hero(), 200);
  const app = [64, 32, 16].map((s) => svg(st.app(), s)).join("");
  const uiDark = [24, 16].map((s) => svg(st.ui(C.W, false), s)).join("");
  const uiLight = [24, 16].map((s) => svg(st.ui(C.D, true), s)).join("");
  const g = GLYPH[st.g];
  return `<article class="card">
    <div class="hero"><span class="tag px">${st.key}</span>${hero}</div>
    <div class="meta"><h2 class="px">${st.name.toUpperCase()}</h2><p>${st.note}</p></div>
    <div class="row"><span>App icon</span><div class="items">${app}</div></div>
    <div class="row"><span>UI</span><div class="items">
      <div class="chip dark">${uiDark}<b class="px">NETHER</b></div>
      <div class="chip light">${uiLight}<b class="px">NETHER</b></div></div></div>
    <div class="row"><span>In game</span><div class="mc">
      <div class="world"><div class="nametag px">${glyph(g)}Player</div></div>
      <div class="world nether"><div class="chat px">&lt;${glyph(g)}Player&gt; gg</div></div></div></div>
  </article>`;
};
document.getElementById("grid").innerHTML = STYLES.map(card).join("");

// Construction: vector over its 9x9 grid, and the glyph.
const gridLines = (() => { let r = ""; for (let i = 0; i <= 9; i++) { r += `<line x1="${ox + i * u}" y1="${oy - 2}" x2="${ox + i * u}" y2="${oy + (HU + 3.6) * u + 2}"/>`; } for (let j = 0; j <= 10; j++) { const y = oy + j * u; r += `<line x1="${ox - 2}" y1="${y}" x2="${ox + 9 * u + 2}" y2="${y}"/>`; } return `<g stroke="rgba(229,55,45,.55)" stroke-width=".35">${r}</g>`; })();
document.getElementById("build").innerHTML =
  `<figure>${svg(mark({ fill: "rgba(255,255,255,.92)" }) + gridLines, 132)}<figcaption>Vector on the grid</figcaption></figure>
   <figure>${glyph(GLYPH.core, 12)}<figcaption>9×9 glyph</figcaption></figure>`;
</script>
</body>
</html>
