name = "nether-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

# signed content (news, packs, capes + manifest) ships with the Worker: GET /content/<file>
# (re-sign with `node backend/content/sign.mjs sign`, then `wrangler deploy`)
[assets]
directory = "../content"
binding = "ASSETS"
run_worker_first = true

[vars]
# Friends-lite: "1" turns the /v1/friends routes on (keep "0" until its security review is done)
FRIENDS = "0"

[[d1_databases]]
binding = "DB"
database_name = "nether"
database_id = "b7d335a6-3b70-4bb8-b95d-262c2657be86"

# daily purge of players unseen for 180 days (scheduled handler)
[triggers]
crons = ["17 3 * * *"]

# Workers Rate Limiting bindings (period 10 or 60 s); the code skips any that are missing
[[ratelimits]]
name = "RL_READ"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_AUTH"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_FRIENDS"
namespace_id = "1004"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_WRITE"
namespace_id = "1003"
simple = { limit = 5, period = 60 }

# SESSION_KEY is a secret: wrangler secret put SESSION_KEY (never put it here)
