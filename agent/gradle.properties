# The client's own version (its releases are tagged v<version> in the client repo). Bump it for every release.
clientVersion=1.0.0
# The launcher <-> client contract (crates/core/src/agent.rs PROTOCOL): the -Dnether.* properties the launcher
# passes, the boot jar beside the agent jar, nether-media.exe beside it. A launcher only installs a client whose
# protocol matches its own, so raise it only for a breaking change, together with the launcher.
clientProtocol=1
